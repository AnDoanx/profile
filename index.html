<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & TikTok Downloader</title>
    <!-- FontAwesome Icon & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text-main: #c9d1d9;
            --text-sub: #8b949e;
            --accent-blue: #58a6ff;
            --accent-tiktok: #ff0050;
            --accent-green: #2ea043;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 550px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* CARD 1: PROFILE CARDS */
        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-blue);
            margin-bottom: 12px;
        }

        .profile-card h1 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .profile-card .bio {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
            margin-bottom: 16px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s;
        }

        .social-btn:hover {
            background: var(--accent-blue);
            color: #fff;
            transform: translateY(-2px);
        }

        /* CARD 2: TIKTOK TOOL */
        .tool-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .tool-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 14px;
        }

        .tool-title i {
            color: var(--accent-tiktok);
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-group input {
            flex: 1;
            background: #0d1117;
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
        }

        .btn-get {
            background: var(--accent-tiktok);
            color: #fff;
            border: none;
            padding: 0 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-get:hover {
            opacity: 0.9;
        }

        /* LOADER & RESULT */
        .loader {
            display: none;
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: var(--text-sub);
        }

        .result-box {
            display: none;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }

        .video-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
        }

        .thumb {
            width: 65px;
            height: 85px;
            border-radius: 8px;
            object-fit: cover;
            background: #0d1117;
        }

        .meta-info h4 {
            font-size: 13px;
            color: #fff;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .meta-info p {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .download-actions {
            display: flex;
            gap: 8px;
        }

        .dl-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .dl-no-wm {
            background: var(--accent-green);
            color: #fff;
        }

        .dl-music {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. PHẦN PROFILE CÁ NHÂN -->
        <div class="profile-card">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Admin" alt="Avatar" class="avatar">
            <h1>Admin Profile</h1>
            <p class="bio">Developer & Media Automation</p>

            <div class="social-links">
                <!-- Thay link Zalo và Email của bạn vào đây -->
                <a href="https://zalo.me" target="_blank" class="social-btn" title="Zalo"><i class="fa-solid fa-comment-dots"></i></a>
                <a href="mailto:admin@gmail.com" class="social-btn" title="Gmail"><i class="fa-solid fa-envelope"></i></a>
                <a href="https://github.com" target="_blank" class="social-btn" title="GitHub"><i class="fa-brands fa-github"></i></a>
            </div>
        </div>

        <!-- 2. PHẦN TOOL TẢI TIKTOK -->
        <div class="tool-card">
            <div class="tool-title">
                <i class="fa-brands fa-tiktok"></i>
                <span>Tải Video TikTok Không Logo</span>
            </div>

            <div class="input-group">
                <input type="text" id="tiktokUrl" placeholder="Dán link TikTok vào đây...">
                <button class="btn-get" onclick="fetchTikTok()">Tải Ngay</button>
            </div>

            <div class="loader" id="loader">
                <i class="fa-solid fa-spinner fa-spin"></i> Đang phân tích link...
            </div>

            <div class="result-box" id="resultBox">
                <div class="video-meta">
                    <img src="" alt="Thumb" class="thumb" id="resThumb">
                    <div class="meta-info">
                        <h4 id="resTitle">Title Video</h4>
                        <p id="resAuthor">@author</p>
                    </div>
                </div>

                <div class="download-actions">
                    <a href="#" target="_blank" class="dl-btn dl-no-wm" id="btnNoWM">
                        <i class="fa-solid fa-download"></i> Video (Không Logo)
                    </a>
                    <a href="#" target="_blank" class="dl-btn dl-music" id="btnMusic">
                        <i class="fa-solid fa-music"></i> Nhạc (MP3)
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- CODE JAVASCRIPT GỌI API SẴN -->
    <script>
        async function fetchTikTok() {
            const urlInput = document.getElementById('tiktokUrl').value.trim();
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');

            if (!urlInput) {
                alert('Vui lòng dán liên kết TikTok!');
                return;
            }

            loader.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                // Tích hợp trực tiếp TikWM API công khai
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const res = await response.json();

                if (res.code === 0) {
                    const data = res.data;

                    document.getElementById('resThumb').src = data.cover;
                    document.getElementById('resTitle').innerText = data.title || 'Video TikTok';
                    document.getElementById('resAuthor').innerText = `@${data.author.unique_id} (${data.author.nickname})`;

                    // Link stream trực tiếp không dán watermark
                    document.getElementById('btnNoWM').href = data.play;
                    document.getElementById('btnMusic').href = data.music;

                    resultBox.style.display = 'block';
                } else {
                    alert('Không lấy được video. Hãy kiểm tra lại đường dẫn!');
                }
            } catch (error) {
                alert('Lỗi kết nối API!');
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
