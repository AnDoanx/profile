<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile của Khoa An</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        /* Loading Bar Cầu Vồng */
        #loader { position: fixed; inset: 0; background: #0f172a; z-index: 999; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s; }
        .progress-bar { width: 0%; height: 5px; background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff); box-shadow: 0 0 10px rgba(255,255,255,0.5); transition: width 2s ease-in-out; }

        .card { background: #1e293b; padding: 2rem; border-radius: 20px; text-align: center; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; margin-bottom: 1rem; border: 4px solid #38bdf8; object-fit: cover; transition: transform 0.3s; }
        .avatar:hover { transform: scale(1.1); }
        .btn { display: block; padding: 12px; margin-top: 10px; background: #334155; text-decoration: none; color: white; border-radius: 10px; transition: 0.3s; }
        .btn:hover { background: #38bdf8; color: #000; transform: translateY(-3px); }

        /* Info Box */
        #info-box { margin-top: 1.5rem; font-size: 0.75rem; color: #94a3b8; background: #0f172a; padding: 10px; border-radius: 8px; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="loader"><div class="progress-bar" id="bar"></div></div>

    <div class="card">
        <img src="https://i.imgur.com/your-image-id.jpg" alt="Avatar" class="avatar">
        <h1>Ng Doãn Khoa An</h1>
        <p>Developer & Student</p>
        
        <div class="link-container">
            <a href="#" class="btn">Facebook</a>
            <a href="#" class="btn">Zalo</a>
            <a href="#" class="btn">Gmail</a>
        </div>

        <div id="info-box">
            Thiết bị: <span id="device">...</span><br>
            Màn hình: <span id="res">...</span><br>
            IP: <span id="ip">Đang tải...</span>
        </div>
    </div>

    <script>
        // 1. Loading hiệu ứng
        const bar = document.getElementById('bar');
        setTimeout(() => { bar.style.width = '100%'; }, 100);
        setTimeout(() => { document.getElementById('loader').style.opacity = '0'; setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 800); }, 2000);

        // 2. Info thiết bị
        document.getElementById('device').innerText = /Android|iPhone/i.test(navigator.userAgent) ? "Mobile" : "PC/Desktop";
        document.getElementById('res').innerText = window.screen.width + "x" + window.screen.height;

        // 3. Lấy IP (Sử dụng IPify API miễn phí)
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => document.getElementById('ip').innerText = data.ip)
            .catch(() => document.getElementById('ip').innerText = "Không xác định");
    </script>
</body>
</html>
