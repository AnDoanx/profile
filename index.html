<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile của Khoa An</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 2rem; border-radius: 20px; text-align: center; width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .avatar { width: 120px; height: 120px; border-radius: 50%; margin-bottom: 1rem; border: 4px solid #38bdf8; object-fit: cover; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .link-container { display: flex; flex-direction: column; gap: 10px; }
        .btn { display: block; padding: 12px; background: #334155; text-decoration: none; color: white; border-radius: 10px; transition: 0.3s; font-weight: 500; }
        .btn:hover { background: #38bdf8; color: #000; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Thay link ảnh tại src bên dưới -->
        <img src="https://i.imgur.com/your-image-id.jpg" alt="Avatar" class="avatar">
        <h1>Ng Doãn Khoa An</h1>
        <p>Developer & Student</p>
        
        <div class="link-container">
            <a href="https://facebook.com/yourprofile" class="btn">Facebook</a>
            <a href="https://zalo.me/yourphonenumber" class="btn">Zalo</a>
            <a href="mailto:your-email@gmail.com" class="btn">Gmail</a>
        </div>
    </div>

</body>
</html>
