<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .profile-card {
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .avatar-container {
            position: relative;
            display: inline-block;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
        }
        .status-badge {
            position: absolute;
            bottom: 10px;
            right: 5px;
            background: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-dot { width: 8px; height: 8px; background: grey; border-radius: 50%; }
        h1 { margin: 10px 0; }
        .bio { font-size: 16px; line-height: 1.5; margin: 20px 0; }
        .hero-image {
            width: 100%;
            height: 200px;
            background: url('https://via.placeholder.com/400x200') center/cover;
            border-radius: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <img src="https://via.placeholder.com/120" alt="Avatar" class="avatar">
            <div class="status-badge"><div class="status-dot"></div> Offline</div>
        </div>
        
        <h1>Mizu 🌹</h1>
        
        <div class="bio">
            <p>I'm <b>Mizu</b>, a Gamer, Biker who loves anime and manga :3</p>
            <br>
            <p>I currently reside and work in Vietnam. I can speak a little English and Chinese, my main language is Vietnamese 🍜</p>
            <br>
            <p>Thank you for reading! Here is a cookie for you :3 meow~ 🍪</p>
        </div>

        <div class="hero-image"></div>
    </div>

</body>
</html>
