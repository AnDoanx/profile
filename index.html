<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mail 10 Phút - Nhận OTP Siêu Tốc</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">

  <div class="max-w-2xl w-full mt-8 bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700">
    <h1 class="text-3xl font-bold text-blue-500 mb-2 text-center">⚡ Web Mail 10 Phút</h1>
    <p class="text-gray-400 text-center mb-6 text-sm">Tạo email tạm thời nhận mã OTP Facebook, TikTok, Netflix và các dịch vụ khác.</p>

    <!-- Khối Địa Chỉ Email -->
    <div class="bg-gray-900 p-4 rounded-xl border border-gray-700 mb-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="w-full sm:w-auto">
        <span class="text-xs text-gray-400 block">Địa chỉ email của bạn:</span>
        <span id="emailAddress" class="text-xl font-mono font-bold text-green-400 break-all">Đang khởi tạo...</span>
      </div>
      <div class="flex gap-2 w-full sm:w-auto">
        <button onclick="copyEmail()" class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-700 text-sm font-semibold px-4 py-2 rounded-lg transition">
          📋 Sao chép
        </button>
        <button onclick="generateNewEmail()" class="flex-1 sm:flex-none bg-gray-700 hover:bg-gray-600 text-sm font-semibold px-4 py-2 rounded-lg transition">
          🔄 Đổi mail
        </button>
      </div>
    </div>

    <!-- Danh sách Hòm thư (Inbox) -->
    <div class="mb-4 flex justify-between items-center">
      <h2 class="text-lg font-semibold text-gray-200">Hòm thư đến (<span id="mailCount">0</span>)</h2>
      <span id="statusText" class="text-xs text-yellow-400 animate-pulse">Đang chờ thư mới...</span>
    </div>

    <div id="inboxList" class="space-y-3">
      <div class="text-center py-8 text-gray-500 text-sm bg-gray-900 rounded-xl border border-dashed border-gray-700">
        Chưa có thư nào. Hãy dùng email phía trên để nhận mã OTP!
      </div>
    </div>
  </div>

  <script>
    let currentLogin = '';
    let currentDomain = '';
    let pollInterval = null;

    // 1. Lấy danh sách Domain khả dụng & tạo email mới
    async function generateNewEmail() {
      document.getElementById('emailAddress').innerText = 'Đang tạo...';
      document.getElementById('inboxList').innerHTML = '<div class="text-center py-8 text-gray-500 text-sm bg-gray-900 rounded-xl border border-dashed border-gray-700">Chưa có thư nào. Hãy dùng email phía trên để nhận mã OTP!</div>';
      document.getElementById('mailCount').innerText = '0';

      try {
        const res = await fetch('https://www.1secmail.com/api/v1/?action=getDomainList');
        const domains = await res.json();
        
        // Tạo username ngẫu nhiên
        currentLogin = Math.random().toString(36).substring(2, 10);
        currentDomain = domains[Math.floor(Math.random() * domains.length)];
        
        const fullEmail = `${currentLogin}@${currentDomain}`;
        document.getElementById('emailAddress').innerText = fullEmail;

        // Bắt đầu vòng lặp quét hòm thư
        if (pollInterval) clearInterval(pollInterval);
        checkInbox();
        pollInterval = setInterval(checkInbox, 4000); // Quét mỗi 4 giây
      } catch (err) {
        document.getElementById('emailAddress').innerText = 'Lỗi kết nối API!';
      }
    }

    // 2. Kiểm tra Hòm thư (Polling API)
    async function checkInbox() {
      if (!currentLogin || !currentDomain) return;

      try {
        const res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${currentLogin}&domain=${currentDomain}`);
        const messages = await res.json();

        document.getElementById('mailCount').innerText = messages.length;

        if (messages.length > 0) {
          document.getElementById('statusText').innerText = '✅ Có thư mới!';
          renderInbox(messages);
        } else {
          document.getElementById('statusText').innerText = 'Đang tự động quét thư mới mỗi 4s...';
        }
      } catch (err) {
        console.error("Lỗi khi quét mail:", err);
      }
    }

    // 3. Hiển thị danh sách Thư & Tự trích xuất mã OTP
    function renderInbox(messages) {
      const container = document.getElementById('inboxList');
      container.innerHTML = '';

      messages.forEach(msg => {
        // Tự động tìm dãy số 4-8 chữ số làm OTP trong tiêu đề/người gửi
        const otpMatch = msg.subject.match(/\b\d{4,8}\b/);
        const otpBadge = otpMatch 
          ? `<span class="bg-green-500/20 text-green-400 border border-green-500/30 text-xs font-bold px-2 py-1 rounded">Mã OTP: ${otpMatch[0]}</span>` 
          : '';

        const mailItem = document.createElement('div');
        mailItem.className = 'bg-gray-900 p-4 rounded-xl border border-gray-700 hover:border-blue-500 transition cursor-pointer';
        mailItem.onclick = () => readMessage(msg.id);
        
        mailItem.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <span class="font-bold text-sm text-blue-400">${msg.from}</span>
            <span class="text-xs text-gray-500">${msg.date}</span>
          </div>
          <div class="font-medium text-gray-200 text-sm mb-2">${msg.subject}</div>
          ${otpBadge}
          <div id="msg-body-${msg.id}" class="hidden mt-3 pt-3 border-t border-gray-800 text-xs text-gray-300">Đang tải nội dung...</div>
        `;
        container.appendChild(mailItem);
      });
    }

    // 4. Đọc chi tiết nội dung thư khi bấm vào
    async function readMessage(id) {
      const bodyDiv = document.getElementById(`msg-body-${id}`);
      if (!bodyDiv) return;

      if (!bodyDiv.classList.contains('hidden')) {
        bodyDiv.classList.add('hidden');
        return;
      }

      bodyDiv.classList.remove('hidden');
      try {
        const res = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${currentLogin}&domain=${currentDomain}&id=${id}`);
        const data = await res.json();
        bodyDiv.innerHTML = data.htmlBody || data.textBody || 'Không có nội dung.';
      } catch (err) {
        bodyDiv.innerText = 'Lỗi khi tải chi tiết thư.';
      }
    }

    // 5. Sao chép email nhanh
    function copyEmail() {
      const email = document.getElementById('emailAddress').innerText;
      if (email && !email.includes('...')) {
        navigator.clipboard.writeText(email);
        alert('Đã sao chép địa chỉ email!');
      }
    }

    // Chạy ngay khi mở web
    generateNewEmail();
  </script>
</body>
</html>
