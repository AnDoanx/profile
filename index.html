<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Store - Thanh Toán</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #94a3b8; }
    select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; }
    button { background: #2563eb; font-weight: bold; cursor: pointer; border: none; margin-top: 10px; }
    button:hover { background: #1d4ed8; }
    .qr-container { text-align: center; margin-top: 20px; display: none; }
    .qr-container img { width: 100%; max-width: 280px; border-radius: 8px; background: #fff; padding: 10px; }
    .info-box { background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 14px; }
    .price { color: #4ade80; font-weight: bold; font-size: 18px; }
  </style>
</head>
<body>

<div class="card">
  <h2>DIGITAL STORE ⚡</h2>

  <!-- Chọn Sản Phẩm -->
  <div class="form-group">
    <label>Chọn dịch vụ:</label>
    <select id="serviceSelect" onchange="updateOptions()">
      <option value="gemini">Gemini Pro</option>
      <option value="spotify">Spotify Premium</option>
    </select>
  </div>

  <!-- Chọn Thời Han -->
  <div class="form-group">
    <label>Chọn gói thời hạn:</label>
    <select id="planSelect" onchange="updatePrice()"></select>
  </div>

  <!-- Hiển thị giá -->
  <div class="info-box">
    <span>Số tiền cần thanh toán: </span>
    <span id="priceDisplay" class="price">0 đ</span>
  </div>

  <button onclick="generatePayment()">Tạo Mã QR Thanh Toán</button>

  <!-- Khung Hiển Thị QR -->
  <div id="qrSection" class="qr-container">
    <img id="qrImage" src="" alt="Mã QR Thanh Toán">
    <div class="info-box" style="text-align: left;">
      <p>Nội dung CK: <b id="codeDisplay" style="color: #facc15;"></b></p>
      <p style="font-size: 12px; color: #94a3b8;">*Vui lòng nhập chính xác nội dung để được tự động duyệt.</p>
    </div>
  </div>
</div>

<script>
  // Cấu hình danh sách sản phẩm & giá
  const products = {
    gemini: [
      { label: "1 Năm - 45.000đ", value: 45000 },
      { label: "6 Tháng - 25.000đ", value: 25000 }
    ],
    spotify: [
      { label: "3 Tháng - 50.000đ", value: 50000 },
      { label: "1 Tháng - 20.000đ", value: 20000 }
    ]
  };

  const BANK_ID = 'MB';
  const ACCOUNT_NO = '274233';

  // Cập nhật danh sách gói theo sản phẩm chọn
  function updateOptions() {
    const service = document.getElementById('serviceSelect').value;
    const planSelect = document.getElementById('planSelect');
    
    planSelect.innerHTML = '';
    products[service].forEach((item, index) => {
      const option = document.createElement('option');
      option.value = item.value;
      option.innerText = item.label;
      planSelect.appendChild(option);
    });

    updatePrice();
  }

  // Cập nhật giá hiển thị
  function updatePrice() {
    const amount = document.getElementById('planSelect').value;
    document.getElementById('priceDisplay').innerText = Number(amount).toLocaleString('vi-VN') + ' đ';
  }

  // Tạo Mã QR
  function generatePayment() {
    const amount = document.getElementById('planSelect').value;
    
    // Tạo mã nội dung ngẫu nhiên (Ví dụ: KH XT4PNX)
    const randomCode = 'KH ' + Math.random().toString(36).substring(2, 8).toUpperCase();
    
    // Gọi API VietQR MB 274233
    const qrUrl = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(randomCode)}`;

    document.getElementById('qrImage').src = qrUrl;
    document.getElementById('codeDisplay').innerText = randomCode;
    document.getElementById('qrSection').style.display = 'block';
  }

  // Khởi tạo giao diện lần đầu
  updateOptions();
</script>

</body>
</html>
