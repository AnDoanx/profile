<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader & Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --card-bg: rgba(22, 28, 45, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #8b5cf6;
            --text: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header .icon {
            font-size: 36px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .header p {
            color: var(--text-sub);
            font-size: 14px;
            margin-top: 4px;
        }

        /* Input Box */
        .input-group {
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding: 0 12px;
            font-size: 14px;
        }

        .btn-extract {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-extract:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Media Preview Card */
        .preview-card {
            display: none;
            margin-top: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .media-info {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .media-thumb {
            width: 90px;
            height: 90px;
            border-radius: 10px;
            object-fit: cover;
            background: #1e293b;
        }

        .media-details h3 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .media-details p {
            color: var(--text-sub);
            font-size: 12px;
            margin-top: 6px;
        }

        /* Options & Download */
        .format-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .format-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .format-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--primary);
            color: #60a5fa;
        }

        .btn-download {
            width: 100%;
            margin-top: 16px;
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background: #16a34a;
        }

        /* Progress Bar */
        .progress-box {
            display: none;
            margin-top: 16px;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), #22c55e);
            transition: width 0.2s;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="icon"><i class="fa-solid fa-cloud-arrow-down"></i></div>
            <h1>Media Downloader</h1>
            <p>Dán liên kết TikTok, YouTube, Facebook... để tải video/audio</p>
        </div>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Dán đường dẫn (URL) vào đây...">
            <button class="btn-extract" onclick="extractURL()">
                <i class="fa-solid fa-magnifying-glass"></i> Phân tích
            </button>
        </div>

        <!-- Preview Card -->
        <div class="preview-card" id="previewCard">
            <div class="media-info">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=200" alt="Thumb" class="media-thumb" id="thumb">
                <div class="media-details">
                    <h3 id="mediaTitle">Cyberpunk Lo-Fi Chill Beats - Relaxing Music Video 4K</h3>
                    <p id="mediaMeta"><i class="fa-regular fa-clock"></i> 03:45 • MP4 / MP3 Available</p>
                </div>
            </div>

            <div class="format-selector">
                <button class="format-btn active" onclick="selectFormat(this, 'mp4')">
                    <i class="fa-solid fa-video"></i> Video (MP4)
                </button>
                <button class="format-btn" onclick="selectFormat(this, 'mp3')">
                    <i class="fa-solid fa-music"></i> Âm thanh (MP3)
                </button>
            </div>

            <button class="btn-download" onclick="startDownload()">
                <i class="fa-solid fa-download"></i> Tải Về Ngay
            </button>

            <div class="progress-box" id="progressBox">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text">
                    <span id="statusText">Đang tải xuống...</span>
                    <span id="percentText">0%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFormat = 'mp4';

        function extractURL() {
            const url = document.getElementById('videoUrl').value.trim();
            if (!url) {
                alert('Vui lòng dán một đường dẫn URL hợp lệ!');
                return;
            }

            // Mô phỏng trích xuất Metadata từ URL
            const preview = document.getElementById('previewCard');
            preview.style.display = 'block';

            // Reset tiến trình cũ
            document.getElementById('progressBox').style.display = 'none';
            document.getElementById('progressFill').style.width = '0%';
        }

        function selectFormat(element, format) {
            document.querySelectorAll('.format-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedFormat = format;
        }

        function startDownload() {
            const progressBox = document.getElementById('progressBox');
            const progressFill = document.getElementById('progressFill');
            const percentText = document.getElementById('percentText');
            const statusText = document.getElementById('statusText');

            progressBox.style.display = 'block';
            let percent = 0;

            const interval = setInterval(() => {
                percent += Math.floor(Math.random() * 15) + 5;
                if (percent >= 100) {
                    percent = 100;
                    clearInterval(interval);
                    statusText.innerText = 'Hoàn tất!';
                    setTimeout(() => {
                        alert(`Đã tải xong file dạng .${selectedFormat.toUpperCase()}!`);
                    }, 300);
                }
                progressFill.style.width = percent + '%';
                percentText.innerText = percent + '%';
            }, 200);
        }
    </script>
</body>
</html>
