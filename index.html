<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Mail 10 Phút Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">

  <div class="max-w-2xl w-full mt-6 bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700">
    <h1 class="text-3xl font-bold text-blue-500 mb-1 text-center">⚡ Web Mail 10 Phút Pro</h1>
    <p class="text-gray-400 text-center mb-6 text-sm">Hệ thống Guerrilla Mail API - Mở CORS Gốc - Siêu Ổn Định</p>

    <!-- Khối Địa Chỉ Email & Đếm Thời Gian -->
    <div class="bg-gray-900 p-4 rounded-xl border border-gray-700 mb-4">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-3">
        <div>
          <span class="text-xs text-gray-400 block">Địa chỉ email hiện tại:</span>
          <span id="emailAddress" class="text-lg font-mono font-bold text-green-400 break-all">Đang khởi tạo...</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs text-gray-400">Hết hạn sau:</span>
          <span id="timerDisplay" class="text-sm font-bold text-yellow-400 bg-gray-800 px-2 py-1 rounded border border-gray-700">10:00</span>
        </div>
      </div>

      <!-- Các nút thao tác -->
      <div class="flex flex-wrap gap-2">
        <button onclick="copyEmail()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-xs font-semibold py-2 px-3 rounded-lg transition">
          📋 Sao chép Mail
        </button>
        <button onclick="resetTimer()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-xs font-semibold py-2 px-3 rounded-lg transition">
          ⏳ Reset Time (10p)
        </button>
        <button onclick="createNewEmail()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-xs font-semibold py-2 px-3 rounded-lg transition">
          🔄 Tạo Mail Mới
        </button>
      </div>
    </div>

    <!-- Khối Tìm & Khôi Phục Mail Cũ -->
    <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-700/60 mb-6">
      <span class="text-xs font-semibold text-gray-300 block mb-2">🔍 Đổi tên hoặc Tìm hòm thư cũ:</span>
      <div class="flex gap-2">
        <input type="text" id="recoverInput" placeholder="Nhập tên user (VD: nguyenvana)" 
          class="flex-1 px-3 py-1.5 bg-gray-900 border border-gray-700 rounded-lg text-xs focus:outline-none focus:border-blue-500 text-white">
        <button onclick="recoverOldEmail()" class="bg-indigo-600 hover:bg-indigo-700 text-xs font-semibold px-4 py-1.5 rounded-lg transition">
          Khôi phục
        </button>
      </div>
    </div>

    <!-- Danh sách Hòm thư -->
    <div class="mb-3 flex justify-between items-center">
      <h2 class="text-base font-semibold text-gray-200">Hòm thư đến (<span id="mailCount">0</span>)</h2>
      <span id="statusText" class="text-xs text-yellow-400 animate-pulse">Đang kết nối...</span>
    </div>

    <div id="inboxList" class="space-y-3">
      <div class="text-center py-8 text-gray-500 text-sm bg-gray-900 rounded-xl border border-dashed border-gray-700">
        Đang chờ thư gửi đến...
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://api.guerrillamail.com/ajax.php';
    let sidToken = '';
    let currentEmail = '';
    let pollInterval = null;
    let timerInterval = null;
    let timeLeft = 600;

    function setStatus(msg) {
      document.getElementById('statusText').innerText = msg;
    }

    // 1. Tạo Email Mới từ Guerrilla Mail
    async function createNewEmail() {
      setStatus('Đang lấy email mới...');
      try {
        const res = await fetch(`${API_BASE}?f=get_email_address`);
        const data = await res.json();
        
        sidToken = data.sid_token;
        currentEmail = data.email_addr;

        updateEmailUI();
        resetTimer();
        startPolling();
      } catch (err) {
        setStatus('❌ Lỗi kết nối API!');
      }
    }

    // 2. Tìm & Đổi tên sang hòm thư cũ
    async function recoverOldEmail() {
      const input = document.getElementById('recoverInput').value.trim();
      if (!input) return alert('Vui lòng nhập tên username cũ!');

      const cleanUser = input.split('@')[0];
      setStatus('Đang đổi hòm thư...');

      try {
        const res = await fetch(`${API_BASE}?f=set_email_user&email_user=${encodeURIComponent(cleanUser)}&sid_token=${sidToken}`);
        const data = await res.json();
        
        currentEmail = data.email_addr;
        updateEmailUI();
        resetTimer();
        startPolling();
        alert(`Đã chuyển sang hòm thư: ${currentEmail}`);
      } catch (err) {
        setStatus('❌ Khôi phục hòm thư thất bại!');
      }
    }

    // 3. Reset thời gian đếm ngược (10 phút)
    function resetTimer() {
      timeLeft = 600;
      if (timerInterval) clearInterval(timerInterval);
      
      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timerDisplay').innerText = 'Hết hạn';
          setStatus('⚠️ Email đã hết hạn! Bấm Reset Time hoặc Tạo Mail Mới.');
          return;
        }

        const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const secs = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    // 4. Lặp quét thư (Polling 3s/lần)
    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      checkInbox();
      pollInterval = setInterval(checkInbox, 3000);
    }

    async function checkInbox() {
      if (!sidToken) return;

      try {
        const res = await fetch(`${API_BASE}?f=check_email&sid_token=${sidToken}&seq=0`);
        const data = await res.json();
        const messages = data.list || [];

        // Lọc bỏ thư chào mừng tự động của hệ thống nếu muốn (giữ lại thư người dùng gửi)
        document.getElementById('mailCount').innerText = messages.length;
        if (messages.length > 0) {
          renderInbox(messages);
          setStatus('✅ Đã cập nhật hộp thư!');
        } else {
          setStatus('Đang chờ thư mới gửi đến (quét mỗi 3s)...');
        }
      } catch (err) {
        console.error("Lỗi quét thư:", err);
      }
    }

    // 5. Hiển thị thư & Tự bóc OTP
    function renderInbox(messages) {
      const container = document.getElementById('inboxList');
      container.innerHTML = '';

      messages.forEach(msg => {
        const fullContent = (msg.mail_subject || '') + ' ' + (msg.mail_excerpt || '');
        const otpMatch = fullContent.match(/\b\d{4,8}\b/);
        const otpBadge = otpMatch 
          ? `<span class="bg-green-500/20 text-green-400 border border-green-500/30 text-xs font-bold px-2 py-1 rounded">Mã OTP: ${otpMatch[0]}</span>` 
          : '';

        const mailItem = document.createElement('div');
        mailItem.className = 'bg-gray-900 p-4 rounded-xl border border-gray-700 hover:border-blue-500 transition cursor-pointer';
        mailItem.onclick = () => fetchMailBody(msg.mail_id);

        mailItem.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <span class="font-bold text-xs text-blue-400 break-all">${msg.mail_from}</span>
            <span class="text-[10px] text-gray-500">${msg.mail_date}</span>
          </div>
          <div class="font-medium text-gray-200 text-sm mb-2">${msg.mail_subject || '(Không có tiêu đề)'}</div>
          ${otpBadge}
          <div id="msg-body-${msg.mail_id}" class="hidden mt-3 pt-3 border-t border-gray-800 text-xs text-gray-300 overflow-x-auto bg-gray-950 p-3 rounded">
            Đang tải nội dung...
          </div>
        `;
        container.appendChild(mailItem);
      });
    }

    // 6. Đọc nội dung thư chi tiết
    async function fetchMailBody(mailId) {
      const bodyDiv = document.getElementById(`msg-body-${mailId}`);
      if (!bodyDiv) return;

      if (!bodyDiv.classList.contains('hidden')) {
        bodyDiv.classList.add('hidden');
        return;
      }

      bodyDiv.classList.remove('hidden');
      try {
        const res = await fetch(`${API_BASE}?f=fetch_email&email_id=${mailId}&sid_token=${sidToken}`);
        const data = await res.json();
        bodyDiv.innerHTML = data.mail_body || 'Không có nội dung.';
      } catch (err) {
        bodyDiv.innerText = 'Lỗi khi tải chi tiết thư.';
      }
    }

    function updateEmailUI() {
      document.getElementById('emailAddress').innerText = currentEmail;
      document.getElementById('recoverInput').value = '';
    }

    function copyEmail() {
      if (currentEmail && !currentEmail.includes('...')) {
        navigator.clipboard.writeText(currentEmail);
        alert('Đã sao chép địa chỉ email!');
      }
    }

    // Chạy app
    createNewEmail();
  </script>
</body>
</html>
