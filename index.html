<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Đang Bảo Trì</title>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .icon-box {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #3b82f6, #06b6d4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
            animation: pulse 2s infinite;
        }

        .icon-box i {
            font-size: 40px;
            color: #ffffff;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(59, 130, 246, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .contact-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .contact-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-contact {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .btn-zalo {
            background-color: #0068ff;
            color: #ffffff;
        }

        .btn-zalo:hover {
            background-color: #0056d6;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 104, 255, 0.3);
        }

        .btn-gmail {
            background-color: #ea4335;
            color: #ffffff;
        }

        .btn-gmail:hover {
            background-color: #d33828;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(234, 67, 53, 0.3);
        }

        .btn-contact i {
            font-size: 18px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 12px;
            color: #475569;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>

        <h1>Hệ Thống Đang Bảo Trì</h1>
        <p>Chúng tôi đang tiến hành nâng cấp hệ thống để mang lại trải nghiệm tốt hơn. Rất mong bạn thông cảm vì sự bất tiện này!</p>

        <div class="contact-title">Liên hệ quản trị viên</div>

        <div class="contact-group">
            <!-- Thay SĐT Zalo của bạn vào phần href bên dưới -->
            <a href="https://zalo.me/0123456789" target="_blank" class="btn-contact btn-zalo">
                <i class="fa-solid fa-comment-dots"></i>
                Chat qua Zalo Admin
            </a>

            <!-- Thay Gmail của bạn vào phần href bên dưới -->
            <a href="mailto:admin@example.com" class="btn-contact btn-gmail">
                <i class="fa-solid fa-envelope"></i>
                Gửi Email Cho Admin
            </a>
        </div>

        <p class="footer-note">&copy; 2026 Admin System. All rights reserved.</p>
    </div>

</body>
</html>
