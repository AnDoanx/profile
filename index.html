<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Mail 10 Phút Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">

  <div class="max-w-2xl w-full mt-6 bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700">
    <h1 class="text-3xl font-bold text-blue-500 mb-1 text-center">⚡ Web Mail 10 Phút Pro</h1>
    <p class="text-gray-400 text-center mb-6 text-sm">Tự động nhận OTP Facebook, TikTok, Netflix... Đọc lại mail cũ & Gia hạn thời gian.</p>

    <!-- Khối Địa Chỉ Email & Đếm Thời Gian -->
    <div class="bg-gray-900 p-4 rounded-xl border border-gray-700 mb-4">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-3">
        <div>
          <span class="text-xs text-gray-400 block">Địa chỉ email hiện tại:</span>
          <span id="emailAddress" class="text-lg font-mono font-bold text-green-400 break-all">Đang khởi tạo...</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs text-gray-400">Hết hạn sau:</span>
          <span id="timerDisplay" class="text-sm font-bold text-yellow-400 bg-gray-800 px-2 py-1 rounded border border-gray-700">10:00</span>
        </div>
      </div>

      <!-- Các nút thao tác -->
      <div class="flex flex-wrap gap-2">
        <button onclick="copyEmail()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-xs font-semibold py-2 px-3 rounded-lg transition">
          📋 Sao chép Mail
        </button>
        <button onclick="resetTimer()" class="flex-1 bg-amber-600 hover:bg-amber-700 text-xs font-semibold py-2 px-3 rounded-lg transition">
          ⏳ Reset Time (10p)
        </button>
        <button onclick="createNewEmail()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-xs font-semibold py-2 px-3 rounded-lg transition">
          🔄 Tạo Mail Mới
        </button>
      </div>
    </div>

    <!-- Khối Tìm & Khôi Phục Mail Cũ -->
    <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-700/60 mb-6">
      <span class="text-xs font-semibold text-gray-300 block mb-2">🔍 Tìm & Đọc lại hòm thư cũ:</span>
      <div class="flex gap-2">
        <input type="text" id="recoverInput" placeholder="Nhập địa chỉ email cũ (Ví dụ: test@apponi.site)" 
          class="flex-1 px-3 py-1.5 bg-gray-900 border border-gray-700 rounded-lg text-xs focus:outline-none focus:border-blue-500 text-white">
        <button onclick="recoverOldEmail()" class="bg-indigo-600 hover:bg-indigo-700 text-xs font-semibold px-4 py-1.5 rounded-lg transition">
          Khôi phục
        </button>
      </div>
    </div>

    <!-- Danh sách Hòm thư -->
    <div class="mb-3 flex justify-between items-center">
      <h2 class="text-base font-semibold text-gray-200">Hòm thư đến (<span id="mailCount">0</span>)</h2>
      <span id="statusText" class="text-xs text-yellow-400 animate-pulse">Đang kiểm tra...</span>
    </div>

    <div id="inboxList" class="space-y-3">
      <div class="text-center py-8 text-gray-500 text-sm bg-gray-900 rounded-xl border border-dashed border-gray-700">
        Đang chờ thư gửi đến...
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://tempmailapi.io.vn/public_api.php';
    const API_KEY = 'tm_cb239073d48c819587379a9fe064dc30e6b975eb05ac66ae';
    
    let currentEmail = '';
    let pollInterval = null;
    let timerInterval = null;
    let timeLeft = 600; // 10 phút

    // 1. Tạo Email Mới dùng API Key & Domain từ hệ thống
    async function createNewEmail() {
      setStatus('Đang tải danh sách domain...');
      try {
        // Lấy danh sách domain
        const domRes = await fetch(`${API_BASE}?action=domains`);
        const domains = await domRes.json();
        
        let targetDomain = 'apponi.site';
        if (Array.isArray(domains) && domains.length > 0) {
          targetDomain = typeof domains[0] === 'string' ? domains[0] : (domains[0].domain || targetDomain);
        }

        setStatus('Đang tạo email...');
        // Gọi API tạo mail
        const createRes = await fetch(`${API_BASE}?action=create&api_key=${API_KEY}&domain=${targetDomain}`);
        const createData = await createRes.json();

        // Lấy địa chỉ email trả về từ API
        if (createData.email) {
          currentEmail = createData.email;
        } else if (createData.data && createData.data.email) {
          currentEmail = createData.data.email;
        } else {
          // Tạo ngẫu nhiên nếu API trả về dạng mảng
          const randomUser = Math.random().toString(36).substring(2, 10);
          currentEmail = `${randomUser}@${targetDomain}`;
        }

        updateEmailUI();
        resetTimer();
        startPolling();
      } catch (err) {
        setStatus('❌ Lỗi khi kết nối API tạo mail!');
      }
    }

    // 2. Tìm & Đọc lại mail cũ (Nhập đầy đủ email hoặc tên user)
    async function recoverOldEmail() {
      const input = document.getElementById('recoverInput').value.trim();
      if (!input) return alert('Vui lòng nhập email hoặc username cũ!');

      let targetEmail = input;
      if (!targetEmail.includes('@')) {
        targetEmail = `${targetEmail}@apponi.site`;
      }

      currentEmail = targetEmail;
      updateEmailUI();
      resetTimer();
      startPolling();
      alert(`Đã khôi phục hòm thư: ${currentEmail}`);
    }

    // 3. Reset thời gian đếm ngược (10 phút)
    function resetTimer() {
      timeLeft = 600;
      if (timerInterval) clearInterval(timerInterval);
      
      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timerDisplay').innerText = 'Hết hạn';
          setStatus('⚠️ Email đã hết hạn! Bấm Reset Time hoặc Tạo Mail Mới.');
          return;
        }

        const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const secs = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    // 4. Lặp kiểm tra thư mới (Polling 3s/lần)
    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      checkInbox();
      pollInterval = setInterval(checkInbox, 3000);
    }

    async function checkInbox() {
      if (!currentEmail) return;

      try {
        const res = await fetch(`${API_BASE}?action=list&email=${encodeURIComponent(currentEmail)}&limit=20`);
        const data = await res.json();
        
        // Kiểm tra dữ liệu danh sách thư trả về
        let messages = [];
        if (Array.isArray(data)) {
          messages = data;
        } else if (data.data && Array.isArray(data.data)) {
          messages = data.data;
        } else if (data.messages && Array.isArray(data.messages)) {
          messages = data.messages;
        }

        document.getElementById('mailCount').innerText = messages.length;
        if (messages.length > 0) {
          renderInbox(messages);
          setStatus('✅ Đã nhận thư mới!');
        } else {
          setStatus('Đang chờ thư mới gửi đến (mỗi 3s)...');
        }
      } catch (err) {
        console.error("Lỗi quét thư:", err);
      }
    }

    // 5. Hiển thị danh sách thư & Bóc tách OTP
    function renderInbox(messages) {
      const container = document.getElementById('inboxList');
      container.innerHTML = '';

      messages.forEach((msg, index) => {
        const subjectText = msg.subject || msg.title || '(Không có tiêu đề)';
        const snippetText = msg.snippet || msg.excerpt || msg.body || '';
        const fullContent = subjectText + ' ' + snippetText;

        // Tìm mã OTP
        const otpMatch = fullContent.match(/\b\d{4,8}\b/);
        const otpBadge = otpMatch 
          ? `<span class="bg-green-500/20 text-green-400 border border-green-500/30 text-xs font-bold px-2 py-1 rounded">Mã OTP: ${otpMatch[0]}</span>` 
          : '';

        const mailItem = document.createElement('div');
        mailItem.className = 'bg-gray-900 p-4 rounded-xl border border-gray-700 hover:border-blue-500 transition cursor-pointer';
        mailItem.onclick = () => fetchMailBody(msg.id || index);

        mailItem.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <span class="font-bold text-xs text-blue-400 break-all">${msg.from || msg.sender || 'Hệ thống'}</span>
            <span class="text-[10px] text-gray-500">${msg.date || msg.created_at || ''}</span>
          </div>
          <div class="font-medium text-gray-200 text-sm mb-2">${subjectText}</div>
          ${otpBadge}
          <div id="msg-body-${msg.id || index}" class="hidden mt-3 pt-3 border-t border-gray-800 text-xs text-gray-300 overflow-x-auto">Đang tải nội dung...</div>
        `;
        container.appendChild(mailItem);
      });
    }

    // 6. Đọc nội dung chi tiết thư
    async function fetchMailBody(id) {
      const bodyDiv = document.getElementById(`msg-body-${id}`);
      if (!bodyDiv) return;

      if (!bodyDiv.classList.contains('hidden')) {
        bodyDiv.classList.add('hidden');
        return;
      }

      bodyDiv.classList.remove('hidden');
      try {
        const res = await fetch(`${API_BASE}?action=read&email=${encodeURIComponent(currentEmail)}`);
        const data = await res.json();
        
        let content = 'Không có nội dung.';
        if (typeof data === 'string') {
          content = data;
        } else {
          content = data.html || data.body || data.content || data.message || JSON.stringify(data);
        }

        bodyDiv.innerHTML = content;
      } catch (err) {
        bodyDiv.innerText = 'Lỗi khi tải chi tiết thư.';
      }
    }

    function updateEmailUI() {
      document.getElementById('emailAddress').innerText = currentEmail;
      document.getElementById('recoverInput').value = '';
    }

    function setStatus(msg) {
      document.getElementById('statusText').innerText = msg;
    }

    function copyEmail() {
      if (currentEmail && !currentEmail.includes('...')) {
        navigator.clipboard.writeText(currentEmail);
        alert('Đã sao chép địa chỉ email!');
      }
    }

    // Chạy ứng dụng
    createNewEmail();
  </script>
</body>
</html>
