<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Mail 10 Phút Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col items-center p-3 sm:p-6 font-sans">

  <div class="max-w-3xl w-full bg-gray-900 p-5 sm:p-7 rounded-3xl shadow-2xl border border-gray-800 space-y-6">
    
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">
        ⚡ WEB MAIL 10 PHÚT PRO
      </h1>
      <p class="text-xs sm:text-sm text-gray-400">Tự chọn Domain & Custom tên theo ý muốn • Live Sync 24/7</p>
    </div>

    <!-- Khối Tùy Chỉnh Email (Custom Name & Select Domain) -->
    <div class="bg-gray-950 p-4 sm:p-5 rounded-2xl border border-gray-800 space-y-4">
      <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Tùy chỉnh hòm thư của bạn</div>
      
      <div class="flex flex-col sm:flex-row gap-2">
        <!-- Input Tên -->
        <input type="text" id="customUser" placeholder="Nhập tên mail (ví dụ: myaccount)" 
          class="flex-1 bg-gray-900 border border-gray-700 focus:border-blue-500 rounded-xl px-3.5 py-2 text-sm text-white outline-none font-mono transition">
        
        <!-- Select Domain -->
        <select id="domainSelect" 
          class="bg-gray-900 border border-gray-700 focus:border-blue-500 rounded-xl px-3.5 py-2 text-sm text-blue-400 font-mono outline-none cursor-pointer transition">
          <option value="guerrillamail.com">@guerrillamail.com</option>
          <option value="guerrillamail.net">@guerrillamail.net</option>
          <option value="guerrillamail.org">@guerrillamail.org</option>
          <option value="sharklasers.com">@sharklasers.com</option>
          <option value="pokemail.net">@pokemail.net</option>
          <option value="grr.la">@grr.la</option>
        </select>

        <!-- Button Đổi Email -->
        <button onclick="applyCustomEmail()" 
          class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-5 py-2 rounded-xl text-sm transition flex items-center justify-center gap-1.5 shadow-lg shadow-blue-600/20">
          <span>⚡ Cập nhật</span>
        </button>
      </div>

      <!-- Địa chỉ hiển thị & Đếm ngược -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pt-2 border-t border-gray-800/80">
        <div>
          <span class="text-[11px] text-gray-500 block">Địa chỉ đang hoạt động:</span>
          <span id="emailAddress" class="text-base sm:text-lg font-mono font-bold text-green-400 break-all">Đang khởi tạo...</span>
        </div>
        
        <div class="flex items-center gap-3 self-end sm:self-auto">
          <div class="text-right">
            <span class="text-[10px] text-gray-500 block">Hết hạn sau</span>
            <span id="timerDisplay" class="text-xs font-mono font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded-md">10:00</span>
          </div>
        </div>
      </div>

      <!-- Button Thao tác nhanh -->
      <div class="flex flex-wrap gap-2 pt-1">
        <button onclick="copyEmail()" class="flex-1 bg-gray-900 hover:bg-gray-800 border border-gray-700 text-xs font-semibold py-2 px-3 rounded-xl transition text-blue-400">
          📋 Sao chép Mail
        </button>
        <button onclick="resetTimer()" class="flex-1 bg-gray-900 hover:bg-gray-800 border border-gray-700 text-xs font-semibold py-2 px-3 rounded-xl transition text-amber-400">
          ⏳ Gia hạn 10p
        </button>
        <button onclick="generateRandomEmail()" class="flex-1 bg-gray-900 hover:bg-gray-800 border border-gray-700 text-xs font-semibold py-2 px-3 rounded-xl transition text-emerald-400">
          🎲 Ngẫu nhiên
        </button>
      </div>
    </div>

    <!-- Hòm thư đến & Thanh trạng thái live -->
    <div class="space-y-3">
      <div class="flex justify-between items-end px-1">
        <div>
          <h2 class="text-base font-bold text-gray-200">Hòm Thư Đến (<span id="mailCount" class="text-blue-400">0</span>)</h2>
        </div>
        
        <!-- Bộ đếm quét liên tục -->
        <div class="flex items-center gap-2 text-xs text-gray-400">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span id="syncStatus">Tự động quét trong <b id="syncCountdown" class="text-emerald-400">3</b>s</span>
        </div>
      </div>

      <!-- Danh sách Mail -->
      <div id="inboxList" class="space-y-3">
        <div class="text-center py-10 text-gray-500 text-xs sm:text-sm bg-gray-950 rounded-2xl border border-dashed border-gray-800">
          Đang chờ thư mới gửi đến...
        </div>
      </div>
    </div>

  </div>

  <script>
    const API_BASE = 'https://api.guerrillamail.com/ajax.php';
    let sidToken = '';
    let currentEmail = '';
    let pollInterval = null;
    let timerInterval = null;
    let countdownInterval = null;
    let timeLeft = 600;
    let syncTime = 3;

    // 1. Khởi tạo Mail Ngẫu Nhiên
    async function generateRandomEmail() {
      try {
        const res = await fetch(`${API_BASE}?f=get_email_address`);
        const data = await res.json();
        
        sidToken = data.sid_token;
        currentEmail = data.email_addr;

        const parts = currentEmail.split('@');
        document.getElementById('customUser').value = parts[0];
        document.getElementById('domainSelect').value = parts[1] || 'guerrillamail.com';

        updateUI();
        resetTimer();
        startPolling();
      } catch (err) {
        alert('Lỗi khởi tạo API!');
      }
    }

    // 2. Áp dụng Tùy chọn Tên & Domain
    async function applyCustomEmail() {
      const user = document.getElementById('customUser').value.trim();
      const domain = document.getElementById('domainSelect').value;

      if (!user) return alert('Vui lòng nhập tên username!');

      try {
        // Đổi tên Username trước
        const resUser = await fetch(`${API_BASE}?f=set_email_user&email_user=${encodeURIComponent(user)}&sid_token=${sidToken}`);
        const dataUser = await resUser.json();
        sidToken = dataUser.sid_token;

        // Đổi tiếp Domain
        const resDomain = await fetch(`${API_BASE}?f=set_forget_me&lang=en&site=${domain}&sid_token=${sidToken}`);
        
        currentEmail = `${user}@${domain}`;
        updateUI();
        resetTimer();
        checkInbox();
      } catch (err) {
        alert('Không thể đổi domain/tên!');
      }
    }

    // 3. Quản lý Đếm Ngược Gia Hạn 10 phút
    function resetTimer() {
      timeLeft = 600;
      if (timerInterval) clearInterval(timerInterval);
      
      timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timerDisplay').innerText = 'Hết hạn';
          return;
        }
        const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const secs = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timerDisplay').innerText = `${mins}:${secs}`;
      }, 1000);
    }

    // 4. Lặp quét thư & Hiển thị đồng hồ đếm giây live
    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      if (countdownInterval) clearInterval(countdownInterval);

      syncTime = 3;
      checkInbox();

      // Đồng hồ đếm 3s->2s->1s
      countdownInterval = setInterval(() => {
        syncTime--;
        if (syncTime <= 0) syncTime = 3;
        document.getElementById('syncCountdown').innerText = syncTime;
      }, 1000);

      // Gọi API quét mỗi 3 giây
      pollInterval = setInterval(() => {
        checkInbox();
      }, 3000);
    }

    // 5. Quét hòm thư
    async function checkInbox() {
      if (!sidToken) return;

      try {
        const res = await fetch(`${API_BASE}?f=check_email&sid_token=${sidToken}&seq=0`);
        const data = await res.json();
        const messages = data.list || [];

        document.getElementById('mailCount').innerText = messages.length;
        if (messages.length > 0) {
          renderInbox(messages);
        }
      } catch (err) {
        console.error("Lỗi quét thư:", err);
      }
    }

    // 6. Hiển thị danh sách & Tự bóc OTP
    function renderInbox(messages) {
      const container = document.getElementById('inboxList');
      container.innerHTML = '';

      messages.forEach(msg => {
        const fullContent = (msg.mail_subject || '') + ' ' + (msg.mail_excerpt || '');
        const otpMatch = fullContent.match(/\b\d{4,8}\b/);
        const otpBadge = otpMatch 
          ? `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold px-2 py-0.5 rounded-md">OTP: ${otpMatch[0]}</span>` 
          : '';

        const mailItem = document.createElement('div');
        mailItem.className = 'bg-gray-950 p-4 rounded-2xl border border-gray-800 hover:border-blue-500/50 transition cursor-pointer space-y-2';
        mailItem.onclick = () => fetchMailBody(msg.mail_id);

        mailItem.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <span class="font-bold text-xs text-blue-400 truncate">${msg.mail_from}</span>
            <span class="text-[10px] text-gray-500 whitespace-nowrap">${msg.mail_date}</span>
          </div>
          <div class="font-medium text-gray-200 text-sm flex items-center justify-between gap-2">
            <span class="truncate">${msg.mail_subject || '(Không tiêu đề)'}</span>
            ${otpBadge}
          </div>
          <div id="msg-body-${msg.mail_id}" class="hidden mt-3 pt-3 border-t border-gray-900 text-xs text-gray-300 overflow-x-auto bg-gray-900/60 p-3 rounded-xl font-mono">
            Đang tải nội dung chi tiết...
          </div>
        `;
        container.appendChild(mailItem);
      });
    }

    // 7. Xem chi tiết nội dung thư
    async function fetchMailBody(mailId) {
      const bodyDiv = document.getElementById(`msg-body-${mailId}`);
      if (!bodyDiv) return;

      if (!bodyDiv.classList.contains('hidden')) {
        bodyDiv.classList.add('hidden');
        return;
      }

      bodyDiv.classList.remove('hidden');
      try {
        const res = await fetch(`${API_BASE}?f=fetch_email&email_id=${mailId}&sid_token=${sidToken}`);
        const data = await res.json();
        bodyDiv.innerHTML = data.mail_body || 'Không có nội dung.';
      } catch (err) {
        bodyDiv.innerText = 'Lỗi tải nội dung.';
      }
    }

    function updateUI() {
      document.getElementById('emailAddress').innerText = currentEmail;
    }

    function copyEmail() {
      if (currentEmail) {
        navigator.clipboard.writeText(currentEmail);
        alert('Đã sao chép địa chỉ email!');
      }
    }

    // Khởi chạy ứng dụng
    generateRandomEmail();
  </script>
</body>
</html>
