<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Store - Thanh Toán Auto</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --success-color: #10b981;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header span { color: var(--accent-color); }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #0d1117;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    select:focus { border-color: var(--accent-color); }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-primary { background: var(--accent-color); color: #fff; margin-top: 10px; }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

    .btn-success { background: var(--success-color); color: #fff; margin-top: 15px; }
    .btn-success:hover { background: #059669; transform: translateY(-1px); }

    .qr-container {
      text-align: center;
      margin-top: 24px;
      display: none;
      border-top: 1px border-style: dashed;
      border-color: var(--border-color);
      padding-top: 20px;
    }

    .qr-container img {
      width: 100%;
      max-width: 240px;
      border-radius: 12px;
      background: #fff;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }

    .timer-box {
      background: rgba(234, 179, 8, 0.1);
      border: 1px solid rgba(234, 179, 8, 0.2);
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      color: #eab308;
      margin: 15px 0;
      display: inline-block;
      width: 100%;
    }

    .info-box {
      background: #0d1117;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 14px;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .info-row:last-child { margin-bottom: 0; }
    .price { color: #4ade80; font-weight: 700; font-size: 17px; }
    .code { background: #21262d; padding: 4px 10px; border-radius: 6px; color: #facc15; font-weight: 700; font-family: monospace; }

    /* Modal kết quả đơn hàng */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 99;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 16px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    .order-id {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
      margin: 15px 0;
      letter-spacing: 1px;
      background: #0d1117;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed #38bdf8;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <h2>DIGITAL <span>STORE</span> ⚡</h2>
  </div>

  <!-- Chọn Dịch Vụ -->
  <div class="form-group">
    <label>Dịch vụ</label>
    <select id="serviceSelect" onchange="updateOptions()">
      <option value="gemini">Gemini Pro</option>
      <option value="spotify">Spotify Premium</option>
      <option value="youtube">YouTube Premium</option>
      <option value="chatgpt">ChatGPT Plus</option>
      <option value="capcut">CapCut Pro</option>
    </select>
  </div>

  <!-- Chọn Thời Hạn -->
  <div class="form-group">
    <label>Gói thời hạn</label>
    <select id="planSelect" onchange="updatePrice()"></select>
  </div>

  <button class="btn btn-primary" onclick="generatePayment()">Tạo Mã QR Thanh Toán</button>

  <!-- Khung QR -->
  <div id="qrSection" class="qr-container">
    <img id="qrImage" src="" alt="Mã QR Thanh Toán">
    
    <div class="timer-box">
      ⏱️ Đang chờ chuyển khoản... Hạn mã: <b id="timerDisplay">10:00</b>
    </div>

    <div class="info-box">
      <div class="info-row">
        <span style="color: var(--text-muted);">Số tiền:</span>
        <span id="priceDisplay" class="price">0 đ</span>
      </div>
      <div class="info-row">
        <span style="color: var(--text-muted);">Nội dung CK:</span>
        <span id="codeDisplay" class="code"></span>
      </div>
    </div>

    <button class="btn btn-success" onclick="confirmPayment()">
      ✔ Tôi đã hoàn tất chuyển khoản
    </button>
  </div>
</div>

<!-- Modal hiển thị sau khi hoàn tất -->
<div id="orderModal" class="modal">
  <div class="modal-content">
    <h3 style="color: #4ade80;">Thanh Toán Hoàn Tất!</h3>
    <p style="font-size: 14px; color: var(--text-muted); margin-top: 8px;">Mã đơn hàng của bạn là:</p>
    
    <div id="orderIdDisplay" class="order-id">---</div>

    <p style="font-size: 13px; color: #8b949e; margin-bottom: 20px;">
      Vui lòng gửi mã đơn hàng này cho Support qua Telegram để nhận dịch vụ ngay lập tức.
    </p>

    <a id="teleLink" href="#" target="_blank" style="text-decoration: none;">
      <button class="btn btn-primary">✈️ Mở Telegram (@iues1hihi)</button>
    </a>
  </div>
</div>

<script>
  const products = {
    gemini: { name: "GEMINI", plans: [{ label: "1 Năm - 45.000đ", value: 45000 }, { label: "6 Tháng - 25.000đ", value: 25000 }] },
    spotify: { name: "SPOTIFY", plans: [{ label: "3 Tháng - 50.000đ", value: 50000 }, { label: "1 Tháng - 20.000đ", value: 20000 }] },
    youtube: { name: "YOUTUBE", plans: [{ label: "1 Tháng - 30.000đ", value: 30000 }, { label: "6 Tháng - 150.000đ", value: 150000 }] },
    chatgpt: { name: "CHATGPT", plans: [{ label: "1 Tháng - 90.000đ", value: 90000 }] },
    capcut: { name: "CAPCUT", plans: [{ label: "1 Tháng - 40.000đ", value: 40000 }, { label: "1 Năm - 250.000đ", value: 250000 }] }
  };

  const BANK_ID = 'MB';
  const ACCOUNT_NO = '274233';
  const TELE_USERNAME = 'iues1hihi';
  let countdownInterval;

  function updateOptions() {
    const serviceKey = document.getElementById('serviceSelect').value;
    const planSelect = document.getElementById('planSelect');
    
    planSelect.innerHTML = '';
    products[serviceKey].plans.forEach(item => {
      const option = document.createElement('option');
      option.value = item.value;
      option.innerText = item.label;
      planSelect.appendChild(option);
    });
    updatePrice();
  }

  function updatePrice() {
    document.getElementById('qrSection').style.display = 'none';
    clearInterval(countdownInterval);
  }

  function startTimer(duration) {
    clearInterval(countdownInterval);
    let timer = duration;
    const display = document.getElementById('timerDisplay');

    countdownInterval = setInterval(() => {
      let m = parseInt(timer / 60, 10);
      let s = parseInt(timer % 60, 10);
      display.textContent = `${m < 10 ? "0" + m : m}:${s < 10 ? "0" + s : s}`;

      if (--timer < 0) {
        clearInterval(countdownInterval);
        document.getElementById('qrSection').style.display = 'none';
        alert("Mã QR đã hết hạn. Vui lòng tạo lại mã mới!");
      }
    }, 1000);
  }

  function generatePayment() {
    const amount = document.getElementById('planSelect').value;
    const randomCode = 'KH ' + Math.random().toString(36).substring(2, 8).toUpperCase();
    const qrUrl = `https://img.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(randomCode)}`;

    document.getElementById('qrImage').src = qrUrl;
    document.getElementById('priceDisplay').innerText = Number(amount).toLocaleString('vi-VN') + ' đ';
    document.getElementById('codeDisplay').innerText = randomCode;
    document.getElementById('qrSection').style.display = 'block';
    
    startTimer(600);
  }

  function confirmPayment() {
    const serviceKey = document.getElementById('serviceSelect').value;
    const prefix = products[serviceKey].name;
    
    // Sinh mã đơn ngẫu nhiên kèm tên sản phẩm (VD: GEMINI-98234)
    const orderId = `${prefix}-${Math.floor(10000 + Math.random() * 90000)}`;
    
    document.getElementById('orderIdDisplay').innerText = orderId;
    
    // Tạo link Telegram truyền sẵn tin nhắn xác nhận
    const message = encodeURIComponent(`Chào shop, mình đã chuyển khoản thành công đơn hàng ${orderId}. Nhờ shop kích hoạt giúp mình!`);
    document.getElementById('teleLink').href = `https://t.me/${TELE_USERNAME}?text=${message}`;
    
    document.getElementById('orderModal').style.display = 'flex';
  }

  updateOptions();
</script>

</body>
</html>
