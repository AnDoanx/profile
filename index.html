<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Mail 10 Phút Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">

  <div class="max-w-2xl w-full mt-6 bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700">
    <h1 class="text-3xl font-bold text-blue-500 mb-1 text-center">⚡ Web Mail 10 Phút Pro</h1>
    <p class="text-gray-400 text-center mb-6 text-sm">Hệ thống API Trực Tiếp (Mail.tm) - Không Proxy - Không Lỗi Vặt</p>

    <!-- Khối Địa Chỉ Email -->
    <div class="bg-gray-900 p-4 rounded-xl border border-gray-700 mb-4">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-3">
        <div class="flex-1">
          <span class="text-xs text-gray-400 block">Địa chỉ email hiện tại:</span>
          <span id="emailAddress" class="text-lg font-mono font-bold text-green-400 break-all">Đang khởi tạo...</span>
        </div>
        <div class="flex flex-col items-end">
          <span class="text-xs text-gray-400">Mật khẩu khôi phục:</span>
          <span id="mailPassword" class="text-sm font-bold text-pink-400 bg-gray-800 px-2 py-1 rounded border border-gray-700">...</span>
        </div>
      </div>

      <!-- Các nút thao tác -->
      <div class="flex flex-wrap gap-2">
        <button onclick="copyData()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-xs font-semibold py-2 px-3 rounded-lg transition">
          📋 Copy Email & Pass
        </button>
        <button onclick="createNewEmail()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-xs font-semibold py-2 px-3 rounded-lg transition">
          🔄 Tạo Mail Mới
        </button>
      </div>
    </div>

    <!-- Khối Tìm & Khôi Phục Mail Cũ -->
    <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-700/60 mb-6">
      <span class="text-xs font-semibold text-gray-300 block mb-2">🔍 Đăng nhập lại hòm thư cũ:</span>
      <div class="flex gap-2">
        <input type="text" id="recoverEmail" placeholder="Nhập Email cũ" class="flex-1 px-3 py-1.5 bg-gray-900 border border-gray-700 rounded-lg text-xs text-white focus:border-blue-500 outline-none">
        <input type="text" id="recoverPass" placeholder="Nhập Mật khẩu" class="flex-1 px-3 py-1.5 bg-gray-900 border border-gray-700 rounded-lg text-xs text-white focus:border-blue-500 outline-none">
        <button onclick="loginOldEmail()" class="bg-indigo-600 hover:bg-indigo-700 text-xs font-semibold px-4 py-1.5 rounded-lg transition">
          Đăng nhập
        </button>
      </div>
    </div>

    <!-- Danh sách Hòm thư -->
    <div class="mb-3 flex justify-between items-center">
      <h2 class="text-base font-semibold text-gray-200">Hòm thư đến (<span id="mailCount">0</span>)</h2>
      <span id="statusText" class="text-xs text-yellow-400 animate-pulse">Đang kết nối máy chủ...</span>
    </div>

    <div id="inboxList" class="space-y-3">
      <div class="text-center py-8 text-gray-500 text-sm bg-gray-900 rounded-xl border border-dashed border-gray-700">
        Đang chờ thư gửi đến...
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://api.mail.tm';
    
    let currentEmail = '';
    let currentPass = '';
    let currentToken = '';
    let pollInterval = null;

    // Hàm cập nhật trạng thái (Hàm bị thiếu ở bản trước)
    function setStatus(msg) {
      const statusEl = document.getElementById('statusText');
      if (statusEl) statusEl.innerText = msg;
    }

    // 1. Tạo Email Mới hoàn toàn
    async function createNewEmail() {
      setStatus('Đang lấy tên miền...');
      try {
        // Lấy danh sách domain
        const domRes = await fetch(`${API_BASE}/domains`);
        const domData = await domRes.json();
        const domain = domData['hydra:member'][0].domain;

        currentEmail = Math.random().toString(36).substring(2, 12) + '@' + domain;
        currentPass = Math.random().toString(36).substring(2, 10);

        setStatus('Đang đăng ký hòm thư...');
        // Tạo tài khoản
        await fetch(`${API_BASE}/accounts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address: currentEmail, password: currentPass })
        });

        // Đăng nhập lấy Token
        await authAccount(currentEmail, currentPass);
      } catch (err) {
        setStatus('❌ Lỗi kết nối API Mail.tm! Bấm Tạo Lại.');
      }
    }

    // 2. Đăng nhập / Khôi phục mail cũ
    async function loginOldEmail() {
      const email = document.getElementById('recoverEmail').value.trim();
      const pass = document.getElementById('recoverPass').value.trim();
      
      if (!email || !pass) return alert('Vui lòng nhập đủ Email và Mật khẩu!');
      
      setStatus('Đang xác thực hòm thư cũ...');
      try {
        await authAccount(email, pass);
        alert('Đăng nhập thành công!');
      } catch (err) {
        alert('Sai Email hoặc Mật khẩu, hoặc hòm thư đã bị xóa!');
        setStatus('❌ Đăng nhập thất bại.');
      }
    }

    // 3. Hàm cấp Token chung
    async function authAccount(email, pass) {
      const tokenRes = await fetch(`${API_BASE}/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address: email, password: pass })
      });
      
      if (!tokenRes.ok) throw new Error('Auth failed');
      
      const tokenData = await tokenRes.json();
      currentToken = tokenData.token;
      currentEmail = email;
      currentPass = pass;

      updateUI();
      startPolling();
    }

    // 4. Lặp kiểm tra hòm thư (3s/lần)
    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      checkInbox();
      pollInterval = setInterval(checkInbox, 3000);
    }

    async function checkInbox() {
      if (!currentToken) return;

      try {
        const res = await fetch(`${API_BASE}/messages?page=1`, {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        const data = await res.json();
        const messages = data['hydra:member'] || [];
        
        document.getElementById('mailCount').innerText = messages.length;
        if (messages.length > 0) {
          renderInbox(messages);
          setStatus('✅ Đã nhận thư mới!');
        } else {
          setStatus('Đang chờ thư gửi đến (quét mỗi 3s)...');
        }
      } catch (err) {
        console.error("Lỗi quét thư:", err);
      }
    }

    // 5. Hiển thị thư & Bóc OTP
    function renderInbox(messages) {
      const container = document.getElementById('inboxList');
      container.innerHTML = '';

      messages.forEach(msg => {
        const fromAddr = msg.from ? (msg.from.address || msg.from.name) : 'Hệ thống';
        const fullText = (msg.subject || '') + ' ' + (msg.intro || '');
        const otpMatch = fullText.match(/\b\d{4,8}\b/);
        
        const otpBadge = otpMatch 
          ? `<span class="bg-green-500/20 text-green-400 border border-green-500/30 text-xs font-bold px-2 py-1 rounded">Mã OTP: ${otpMatch[0]}</span>` 
          : '';

        const mailItem = document.createElement('div');
        mailItem.className = 'bg-gray-900 p-4 rounded-xl border border-gray-700 hover:border-blue-500 transition cursor-pointer';
        mailItem.onclick = () => fetchMailBody(msg.id);

        mailItem.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <span class="font-bold text-xs text-blue-400 break-all">${fromAddr}</span>
            <span class="text-[10px] text-gray-500">${new Date(msg.createdAt).toLocaleTimeString()}</span>
          </div>
          <div class="font-medium text-gray-200 text-sm mb-2">${msg.subject || '(Không tiêu đề)'}</div>
          ${otpBadge}
          <div id="msg-body-${msg.id}" class="hidden mt-3 pt-3 border-t border-gray-800 text-xs text-gray-300 overflow-x-auto bg-gray-950 p-2 rounded">
            Đang tải nội dung...
          </div>
        `;
        container.appendChild(mailItem);
      });
    }

    // 6. Tải chi tiết thư
    async function fetchMailBody(id) {
      const bodyDiv = document.getElementById(`msg-body-${id}`);
      if (!bodyDiv) return;

      if (!bodyDiv.classList.contains('hidden')) {
        bodyDiv.classList.add('hidden');
        return;
      }

      bodyDiv.classList.remove('hidden');
      try {
        const res = await fetch(`${API_BASE}/messages/${id}`, {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        const data = await res.json();
        
        // Cố gắng lấy HTML, nếu không có thì lấy text
        let htmlContent = 'Không có nội dung.';
        if (data.html && Array.isArray(data.html)) {
            htmlContent = data.html[0];
        } else if (data.text) {
            htmlContent = `<pre class="whitespace-pre-wrap font-sans">${data.text}</pre>`;
        }
        
        bodyDiv.innerHTML = htmlContent;
      } catch (err) {
        bodyDiv.innerText = 'Lỗi khi tải chi tiết thư.';
      }
    }

    // 7. Cập nhật UI & Copy
    function updateUI() {
      document.getElementById('emailAddress').innerText = currentEmail;
      document.getElementById('mailPassword').innerText = currentPass;
    }

    function copyData() {
      if (currentEmail) {
        navigator.clipboard.writeText(`Email: ${currentEmail}\nPass: ${currentPass}`);
        alert('Đã copy Email và Password!');
      }
    }

    // Khởi động app
    createNewEmail();
  </script>
</body>
</html>
