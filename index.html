<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Dịch Vụ Số - Thanh Toán QR</title>
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gradient-text { background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Hiệu ứng xoay tròn */
        @keyframes spinner {
            to { transform: rotate(360deg); }
        }
        .animate-spin-custom {
            animation: spinner 1.2s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <header class="sticky top-0 z-40 glass-card border-b border-slate-800 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center shadow-lg shadow-sky-500/20">
                    <i class="fa-solid fa-bolt text-white text-xl"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-white">DIGITAL <span class="gradient-text">STORE</span></span>
            </div>
            <div class="text-xs sm:text-sm font-medium text-slate-400">
                <i class="fa-solid fa-shield-halved text-emerald-400 mr-1"></i> Thanh toán tự động 24/7
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Danh sách sản phẩm -->
        <section class="lg:col-span-7 space-y-4">
            <h2 class="text-lg font-bold text-slate-200 flex items-center">
                <i class="fa-solid fa-cubes text-sky-400 mr-2"></i> Chọn gói dịch vụ
            </h2>
            <div id="productList" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </section>

        <!-- Hóa đơn & QR Thanh toán -->
        <section class="lg:col-span-5">
            <div class="glass-card rounded-2xl p-6 sticky top-24 shadow-2xl">
                <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700/60 pb-3 flex items-center justify-between">
                    <span><i class="fa-solid fa-receipt text-indigo-400 mr-2"></i> Đơn hàng của bạn</span>
                    <span id="orderIdTag" class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full font-mono">#---</span>
                </h2>

                <!-- Form nhập thông tin -->
                <div class="mt-4 space-y-3">
                    <div>
                        <label class="text-xs font-semibold text-slate-400 block mb-1">SẢN PHẨM ĐÃ CHỌN</label>
                        <div id="selectedProdName" class="p-3 bg-slate-900/80 border border-slate-700/50 rounded-xl font-medium text-sky-300">
                            Vui lòng chọn 1 sản phẩm
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-semibold text-slate-400 block mb-1">HỌ VÀ TÊN</label>
                            <input type="text" id="custName" placeholder="Nguyễn Văn A" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-400 block mb-1">SỐ ĐIỆN THOẠI</label>
                            <input type="text" id="custPhone" placeholder="09xxx..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-sky-500">
                        </div>
                    </div>
                </div>

                <!-- Nút bấm tạo mã QR -->
                <button id="btnPay" onclick="generateQR()" class="w-full mt-5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-sky-500/25 flex items-center justify-center space-x-2 opacity-50 cursor-not-allowed" disabled>
                    <i class="fa-solid fa-qrcode"></i>
                    <span>Tạo Mã QR Thanh Toán</span>
                </button>

                <!-- Khung hiển thị QR & Thanh Xoay Chờ -->
                <div id="qrArea" class="hidden mt-6 text-center border-t border-slate-700/60 pt-5 space-y-4">
                    
                    <!-- Mã QR cố định của bạn -->
                    <div class="bg-white p-3 rounded-2xl inline-block shadow-xl relative group">
                        <img id="qrImg" src="https://kommodo.ai/i/kbyeAMVBPtkK1oIH5ttD" alt="QR STK Thanh Toán" class="w-52 h-52 mx-auto rounded-lg object-contain">
                    </div>

                    <!-- Thanh xoay trạng thái chờ -->
                    <div id="waitingStatus" class="flex items-center justify-center space-x-2 bg-slate-900/90 py-2.5 px-4 rounded-xl border border-sky-500/30 text-sky-400 text-xs font-medium">
                        <div class="w-4 h-4 border-2 border-sky-400 border-t-transparent rounded-full animate-spin-custom"></div>
                        <span>Đang chờ chuyển khoản... Hạn mã: <strong id="timer" class="text-amber-400 font-mono">10:00</strong></span>
                    </div>

                    <!-- Thông tin chi tiết đơn -->
                    <div class="bg-slate-900/90 p-3.5 rounded-xl border border-slate-800 text-left text-xs space-y-2">
                        <div class="flex justify-between">
                            <span class="text-slate-400">Số tiền cần chuyển:</span>
                            <span class="font-extrabold text-emerald-400 text-sm" id="payAmount">0 đ</span>
                        </div>
                        <div class="flex justify-between border-t border-slate-800 pt-2">
                            <span class="text-slate-400">Nội dung chuyển khoản:</span>
                            <span class="font-mono font-bold text-amber-400 flex items-center cursor-pointer" onclick="copyText('transferCode')">
                                <span id="transferCode">--</span> <i class="fa-regular fa-copy ml-1"></i>
                            </span>
                        </div>
                    </div>

                    <!-- Nút xác nhận thanh toán -->
                    <button id="btnConfirm" onclick="confirmPayment()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-xl transition-all flex items-center justify-center space-x-2 shadow-lg shadow-emerald-600/20">
                        <i class="fa-solid fa-circle-check"></i>
                        <span>Tôi đã hoàn tất chuyển khoản</span>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const products = [
            { id: 1, name: "YouTube Premium 1 Tháng", price: 35000, desc: "Nâng cấp chính chủ, không quảng cáo" },
            { id: 2, name: "YouTube Premium 1 Năm", price: 320000, desc: "Gói gia đình trọn gói tiết kiệm" },
            { id: 3, name: "CapCut Pro 1 Tháng", price: 45000, desc: "Mở khóa full tính năng VIP & Mẫu" },
            { id: 4, name: "Canva Pro vĩnh viễn", price: 69000, desc: "Thiết kế không giới hạn tài nguyên" }
        ];

        let selectedProduct = null;
        let currentOrderCode = "";
        let timerInterval = null;

        function renderProducts() {
            const container = document.getElementById('productList');
            container.innerHTML = products.map(p => `
                <div onclick="selectProduct(${p.id})" id="prod-${p.id}" class="glass-card p-5 rounded-2xl cursor-pointer transition-all hover:border-sky-500/50 relative overflow-hidden group">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-base text-white group-hover:text-sky-300 transition-colors">${p.name}</h3>
                        <span class="text-xs bg-sky-500/10 text-sky-400 font-bold px-2 py-1 rounded-lg">HOT</span>
                    </div>
                    <p class="text-slate-400 text-xs mb-4">${p.desc}</p>
                    <div class="text-lg font-extrabold text-emerald-400">${p.price.toLocaleString('vi-VN')} đ</div>
                </div>
            `).join('');
        }

        function selectProduct(id) {
            products.forEach(p => {
                const el = document.getElementById(`prod-${p.id}`);
                if (p.id === id) {
                    el.classList.add('border-sky-500', 'bg-sky-500/10');
                    selectedProduct = p;
                } else {
                    el.classList.remove('border-sky-500', 'bg-sky-500/10');
                }
            });
            
            document.getElementById('selectedProdName').innerText = `${selectedProduct.name} - ${selectedProduct.price.toLocaleString('vi-VN')} đ`;
            
            const btn = document.getElementById('btnPay');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function generateQR() {
            if (!selectedProduct) return;

            currentOrderCode = "STORE" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('orderIdTag').innerText = "#" + currentOrderCode;
            document.getElementById('transferCode').innerText = currentOrderCode;
            document.getElementById('payAmount').innerText = selectedProduct.price.toLocaleString('vi-VN') + " đ";

            document.getElementById('qrArea').classList.remove('hidden');

            // Khởi chạy đếm ngược 10 phút (600s)
            startTimer(600);
        }

        function startTimer(duration) {
            clearInterval(timerInterval);
            let timer = duration, minutes, seconds;
            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                document.getElementById('timer').textContent = minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    document.getElementById('waitingStatus').innerHTML = `<span class="text-rose-400 font-bold">Mã đã hết hạn, vui lòng tạo mới!</span>`;
                }
            }, 1000);
        }

        function copyText(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            alert("Đã sao chép nội dung chuyển khoản: " + text);
        }

        function confirmPayment() {
            clearInterval(timerInterval);
            const statusBox = document.getElementById('waitingStatus');
            statusBox.className = "flex items-center justify-center space-x-2 bg-emerald-500/20 py-2.5 px-4 rounded-xl border border-emerald-500/50 text-emerald-300 text-xs font-semibold";
            statusBox.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-base"></i><span>Đã xác nhận! Hệ thống đang xử lý đơn hàng #${currentOrderCode}...</span>`;

            const btnConfirm = document.getElementById('btnConfirm');
            btnConfirm.disabled = true;
            btnConfirm.classList.add('opacity-50', 'cursor-not-allowed');
            btnConfirm.innerText = "Đã nhận xác nhận";
            
            alert(`Cảm ơn bạn! Đã nhận xác nhận chuyển khoản cho đơn hàng #${currentOrderCode}.\nHệ thống sẽ kiểm tra và kích hoạt dịch vụ cho bạn trong giây lát!`);
        }

        renderProducts();
    </script>
</body>
</html>
