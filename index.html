<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Mail 10 Phút Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">

  <div class="max-w-2xl w-full mt-6 bg-gray-800 p-6 rounded-2xl shadow-2xl border border-gray-700">
    <h1 class="text-3xl font-bold text-blue-500 mb-1 text-center">⚡ Web Mail 10 Phút Pro</h1>
    <p class="text-gray-400 text-center mb-6 text-sm">Hệ thống API Ổn Định Nhất - Tự động lưu thư khi F5 tải lại trang.</p>

    <!-- Khối Địa Chỉ Email -->
    <div class="bg-gray-900 p-4 rounded-xl border border-gray-700 mb-4">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 mb-3">
        <div class="flex-1">
          <span class="text-xs text-gray-400 block">Địa chỉ email hiện tại:</span>
          <span id="emailAddress" class="text-lg font-mono font-bold text-green-400 break-all">Đang tải API...</span>
        </div>
        <div class="flex flex-col items-end">
          <span class="text-xs text-gray-400">Mã khôi phục (Token):</span>
          <span id="mailToken" class="text-sm font-bold text-pink-400 bg-gray-800 px-2 py-1 rounded border border-gray-700 max-w-[150px] truncate">...</span>
        </div>
      </div>

      <!-- Các nút thao tác -->
      <div class="flex flex-wrap gap-2">
        <button onclick="copyData()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-xs font-semibold py-2 px-3 rounded-lg transition">
          📋 Copy Email
        </button>
        <button onclick="copyToken()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-xs font-semibold py-2 px-3 rounded-lg transition">
          🔑 Copy Token
        </button>
        <button onclick="forceCreateNewEmail()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-xs font-semibold py-2 px-3 rounded-lg transition">
          🔄 Đổi Mail Mới
        </button>
      </div>
    </div>

    <!-- Khối Khôi Phục Mail Cũ -->
    <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-700/60 mb-6">
      <span class="text-xs font-semibold text-gray-300 block mb-2">🔍 Đăng nhập lại hòm thư cũ:</span>
      <div class="flex gap-2">
        <input type="text" id="recoverToken" placeholder="Dán Mã Token vào đây..." class="flex-1 px-3 py-1.5 bg-gray-900 border border-gray-700 rounded-lg text-xs text-white focus:border-blue-500 outline-none">
        <button onclick="loginOldEmail()" class="bg-indigo-600 hover:bg-indigo-700 text-xs font-semibold px-4 py-1.5 rounded-lg transition">
          Đăng nhập
        </button>
      </div>
    </div>

    <!-- Danh sách Hòm thư -->
    <div class="mb-3 flex justify-between items-center">
      <h2 class="text-base font-semibold text-gray-200">Hòm thư đến (<span id="mailCount">0</span>)</h2>
      <span id="statusText" class="text-xs text-yellow-400 animate-pulse">Đang kết nối...</span>
    </div>

    <div id="inboxList" class="space-y-3">
      <div class="text-center py-8 text-gray-500 text-sm bg-gray-900 rounded-xl border border-dashed border-gray-700">
        Đang chờ thư gửi đến...
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://api.tempmail.lol/v2';
    
    let currentEmail = '';
    let currentToken = '';
    let pollInterval = null;

    function setStatus(msg) {
      const statusEl = document.getElementById('statusText');
      if (statusEl) statusEl.innerText = msg;
    }

    // 1. Khởi chạy & Chống mất mail khi F5
    function init() {
      const savedEmail = localStorage.getItem('tmp_email');
      const savedToken = localStorage.getItem('tmp_token');
      
      if (savedEmail && savedToken) {
        currentEmail = savedEmail;
        currentToken = savedToken;
        updateUI();
        startPolling();
        setStatus('✅ Đã nạp lại phiên làm việc trước đó!');
      } else {
        createNewEmail();
      }
    }

    // 2. Ép tạo mail mới hoàn toàn
    function forceCreateNewEmail() {
      localStorage.removeItem('tmp_email');
      localStorage.removeItem('tmp_token');
      createNewEmail();
    }

    // 3. API Tạo Mail
    async function createNewEmail() {
      setStatus('Đang tạo mail mới...');
      try {
        const res = await fetch(`${API_BASE}/inbox/create`);
        const data = await res.json();
        
        if (!data.address) throw new Error('API Error');

        currentEmail = data.address;
        currentToken = data.token;
        
        // Lưu thẳng vào trình duyệt
        localStorage.setItem('tmp_email', currentEmail);
        localStorage.setItem('tmp_token', currentToken);

        updateUI();
        startPolling();
      } catch (err) {
        setStatus('❌ Lỗi tạo mail. Vui lòng thử lại sau.');
      }
    }

    // 4. Khôi phục mail bằng Token
    function loginOldEmail() {
      const tokenInput = document.getElementById('recoverToken').value.trim();
      if (!tokenInput) return alert('Vui lòng nhập Token cũ!');
      
      currentToken = tokenInput;
      currentEmail = 'Mail đã khôi phục (Chỉ xem)'; // API này dùng token để dò lại thư
      
      localStorage.setItem('tmp_token', currentToken);
      localStorage.setItem('tmp_email', currentEmail);
      
      updateUI();
      startPolling();
      alert('Đã khôi phục thành công! Chờ vài giây để tải thư.');
    }

    // 5. Lặp kiểm tra thư mới (Mỗi 3s)
    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      checkInbox();
      pollInterval = setInterval(checkInbox, 3000);
    }

    async function checkInbox() {
      if (!currentToken) return;

      try {
        const res = await fetch(`${API_BASE}/inbox?token=${currentToken}`);
        const data = await res.json();
        const messages = data.emails || [];
        
        document.getElementById('mailCount').innerText = messages.length;
        if (messages.length > 0) {
          renderInbox(messages);
          setStatus('✅ Đã cập nhật hộp thư!');
        } else {
          setStatus('Đang chờ thư gửi đến (quét mỗi 3s)...');
        }
      } catch (err) {
        console.error("Lỗi quét thư:", err);
      }
    }

    // 6. Hiển thị thư & Nội dung ngay lập tức
    function renderInbox(messages) {
      const container = document.getElementById('inboxList');
      container.innerHTML = '';

      messages.forEach((msg, index) => {
        const fromAddr = msg.from || 'Hệ thống';
        const fullText = (msg.subject || '') + ' ' + (msg.body || '');
        
        // Tự bóc OTP siêu việt
        const otpMatch = fullText.match(/\b\d{4,8}\b/);
        const otpBadge = otpMatch 
          ? `<span class="bg-green-500/20 text-green-400 border border-green-500/30 text-xs font-bold px-2 py-1 rounded">Mã OTP: ${otpMatch[0]}</span>` 
          : '';

        const mailItem = document.createElement('div');
        mailItem.className = 'bg-gray-900 p-4 rounded-xl border border-gray-700 hover:border-blue-500 transition cursor-pointer';
        
        // Logic bấm mở thẳng thư không cần tải thêm API
        mailItem.onclick = () => {
          const bodyDiv = document.getElementById(`msg-body-${index}`);
          bodyDiv.classList.toggle('hidden');
        };

        const mailContent = msg.html 
          ? msg.html 
          : `<pre class="whitespace-pre-wrap font-sans text-sm">${msg.body || 'Thư rỗng.'}</pre>`;

        mailItem.innerHTML = `
          <div class="flex justify-between items-start mb-1">
            <span class="font-bold text-xs text-blue-400 break-all">${fromAddr}</span>
            <span class="text-[10px] text-gray-500">Thư mới</span>
          </div>
          <div class="font-medium text-gray-200 text-sm mb-2">${msg.subject || '(Không tiêu đề)'}</div>
          ${otpBadge}
          <div id="msg-body-${index}" class="hidden mt-3 pt-3 border-t border-gray-800 text-xs text-gray-300 overflow-x-auto bg-gray-950 p-3 rounded">
            ${mailContent}
          </div>
        `;
        container.appendChild(mailItem);
      });
    }

    // 7. Cập nhật Giao diện & Copy
    function updateUI() {
      document.getElementById('emailAddress').innerText = currentEmail;
      document.getElementById('mailToken').innerText = currentToken;
      document.getElementById('recoverToken').value = '';
    }

    function copyData() {
      if (currentEmail) {
        navigator.clipboard.writeText(currentEmail);
        alert('Đã copy Email!');
      }
    }
    
    function copyToken() {
      if (currentToken) {
        navigator.clipboard.writeText(currentToken);
        alert('Đã copy Mã Token khôi phục!');
      }
    }

    // Khởi động
    init();
  </script>
</body>
</html>
